services:
  # Primary Unified Full-Stack Web Service (FastAPI API + Built React SPA)
  - type: web
    name: roadmapiq
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.16"
      - key: APP_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://roadmapiq-2.onrender.com","http://localhost:5173","http://127.0.0.1:5173"]'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
